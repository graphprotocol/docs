name: Staging CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Builds the staging image and pushes it to ghcr.io; it deploys nothing.
# Staging runs on stg-apps-us-central1, delivered by Argo CD and Kargo from
# graphprotocol/graph-infra: Kargo follows this image's `latest` tag, which only
# builds of the default branch move.

permissions:
  actions: write # cancel-workflow-action
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/graphprotocol/graph-docs-staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # required to respect .dockerignore
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:latest
          cache-to: type=inline
          build-args: |
            ENVIRONMENT=staging
            ORIGIN=https://staging.thegraph.com
          tags: |
            ${{ env.BASE_IMAGE }}:${{ github.sha }}
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('{0}:latest', env.BASE_IMAGE) || '' }}
          push: true
